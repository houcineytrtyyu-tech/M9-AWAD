<body>
<canvas id="c" width="288" height="512"></canvas>
<script>
(function () {
'use strict';

/* =====================================================================
   الإعدادات  (غيّر POINTS_PER_WORLD لتغيير عدد النقاط بين العوالم)
   اختبار سريع:  ملف.html?world=3   أو   ملف.html?pts=3
   ===================================================================== */
var W = 288, H = 512, S = 2, HW = 144, HH = 256;
var GROUND_H = 56, GROUND_Y = H - GROUND_H, GY = GROUND_Y / S;
var QS = new URLSearchParams(location.search);
var POINTS_PER_WORLD = (function () { var v = parseInt(QS.get('pts'), 10); return v >= 1 && v <= 100 ? v : 10; })();
var START = (function () { var v = parseInt(QS.get('world'), 10); return v >= 1 && v <= 4 ? v - 1 : 0; })();
var BIRD_X = 84;
var PIPE_W = 52, CAP_H = 24, PIPE_SPACING = 172;
var GRAV = 1400, FLAP = 410, MAX_FALL = 580, TRANS_T = 1.6;

/* =====================================================================
   أدوات الرسم
   ===================================================================== */
function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function smooth(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }
function mk(w, h) { var c = document.createElement('canvas'); c.width = w; c.height = h; var g = c.getContext('2d'); g.imageSmoothingEnabled = false; return { c: c, g: g }; }
function R(g, col, x, y, w, h) { if (w < 1 || h < 1) return; g.fillStyle = col; g.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h)); }
function disc(g, col, cx, cy, r) { for (var dy = -r; dy <= r; dy++) { var w = Math.floor(Math.sqrt(r * r - dy * dy + 0.5)); R(g, col, cx - w, cy + dy, w * 2 + 1, 1); } }
function rgb(c) { return [parseInt(c.substr(1, 2), 16), parseInt(c.substr(3, 2), 16), parseInt(c.substr(5, 2), 16)]; }
function mix(a, b, t) { var A = rgb(a), B = rgb(b); return 'rgb(' + Math.round(A[0] + (B[0] - A[0]) * t) + ',' + Math.round(A[1] + (B[1] - A[1]) * t) + ',' + Math.round(A[2] + (B[2] - A[2]) * t) + ')'; }
function bands(g, stops, y0, y1, bh) {
  var n = Math.ceil((y1 - y0) / bh);
  for (var i = 0; i < n; i++) {
    var f = (n > 1 ? i / (n - 1) : 0) * (stops.length - 1), k = Math.min(stops.length - 2, Math.floor(f));
    R(g, mix(stops[k], stops[k + 1], f - k), 0, y0 + i * bh, HW, Math.min(bh, y1 - (y0 + i * bh)));
  }
}
function wr(fn) { fn(-HW); fn(0); fn(HW); }
function cloud(g, x, y, s, c1, c2) {
  var A = [[7, 0, 6], [3, 2, 14], [1, 4, 20], [0, 6, 22], [0, 8, 22]];
  for (var i = 0; i < A.length; i++) R(g, i >= 4 ? c2 : c1, x + A[i][0] * s, y + A[i][1] * s, A[i][2] * s, 2 * s);
}
function pyramid(g, cx, base, hb, h, lit, shade, l1, l2) {
  var top = base - h, i;
  for (i = 0; i < h; i++) {
    var half = Math.max(1, Math.round(hb * (i + 1) / h)), y = top + i;
    R(g, lit, cx - half, y, half, 1); R(g, shade, cx, y, half, 1);
    if (i % 4 === 3) { R(g, l1, cx - half, y, half, 1); R(g, l2, cx, y, half, 1); }
  }
  for (var b = 0; b * 4 < h; b++) {
    var yy = top + b * 4, off = (b % 2) * 5, hf = Math.round(hb * (b * 4 + 1) / h);
    for (var j = -hb + off; j < hb; j += 10) { if (Math.abs(j) < hf - 1) R(g, j < 0 ? l1 : l2, cx + j, yy, 1, 3); }
  }
  R(g, '#fff2c4', cx - 1, top, 2, 1);
}
function pine(g, cx, base, hgt, wd, cL, cD, sn) {
  var n = Math.max(3, Math.round(hgt / 16)), step = hgt / (n + 0.8);
  R(g, cD, cx - 1, base - 6, 2, 6);
  for (var k = 0; k < n; k++) {
    var apex = base - hgt + k * step, th = Math.round(step * 1.9), hw = Math.round(wd * (0.35 + 0.65 * (k + 1) / n) / 2);
    for (var r = 0; r < th; r++) {
      var half = Math.max(1, Math.round(hw * (r + 1) / th)), y = Math.round(apex + r), snow = sn && r < th * 0.45;
      R(g, snow ? sn[0] : cL, cx - half, y, half, 1); R(g, snow ? sn[1] : cD, cx, y, half, 1);
    }
  }
}
function mountain(g, cx, base, h, hw, lit, shade, sL, sS, frac, seed) {
  for (var x = -hw; x <= hw; x++) {
    var t = 1 - Math.abs(x) / hw, ch = Math.round(h * t + 1.5 * Math.sin(x * 1.3 + seed));
    if (ch < 1) continue;
    var top = base - ch, left = x < 0;
    R(g, left ? lit : shade, cx + x, top, 1, ch);
    var depth = Math.max(0, ch - h * (1 - frac) + Math.round(2 * Math.sin(x * 1.1 + seed)));
    if (depth > 0) R(g, left ? sL : sS, cx + x, top, 1, Math.min(depth, ch));
  }
}

/* =====================================================================
   العالم 1 : السهول الخضراء  (طواحين ومزارع)
   ===================================================================== */
function buildW1() {
  var r = rng(11), g, i;
  var sky = mk(HW, HH); g = sky.g;
  bands(g, ['#3f9be0', '#6cbcf0', '#a8dcf6', '#dff3ea'], 0, GY, 4);
  R(g, '#6ab83e', 0, GY, HW, HH - GY);
  disc(g, '#fff1a8', 112, 32, 10); disc(g, '#fffbd8', 112, 32, 8);

  var l0 = mk(HW, 60);
  wr(function (o) { cloud(l0.g, 6 + o, 8, 1, '#fff', '#d6e8f6'); cloud(l0.g, 50 + o, 24, 2, '#fff', '#d6e8f6'); cloud(l0.g, 106 + o, 6, 1, '#fff', '#d6e8f6'); });

  var hillA = function (x) { var t = x / HW * Math.PI * 2; return 44 + 8 * Math.sin(t * 2 + 0.6) + 5 * Math.sin(t * 5 + 1.3) + 3 * Math.sin(t * 9); };
  var hillB = function (x) { var t = x / HW * Math.PI * 2; return 26 + 7 * Math.sin(t * 3 + 2.1) + 4 * Math.sin(t * 7 + 0.2); };
  var l1 = mk(HW, 92);
  for (var x = 0; x < HW; x++) {
    var ta = 92 - Math.round(hillA(x)), tb = 92 - Math.round(hillB(x));
    R(l1.g, '#8fd0a8', x, ta, 1, 92 - ta); R(l1.g, '#b6e6c4', x, ta, 1, 1);
    R(l1.g, '#6cba68', x, tb, 1, 92 - tb); R(l1.g, '#92d484', x, tb, 1, 1);
  }
  var tl = []; for (i = 0; i < 12; i++) tl.push(Math.floor(r() * HW));
  wr(function (o) { tl.forEach(function (tx) { var y = 92 - Math.round(hillB(tx)); R(l1.g, '#3f9a4a', tx - 1 + o, y - 4, 3, 4); R(l1.g, '#5cba5c', tx - 1 + o, y - 4, 1, 2); }); });

  var l2 = mk(HW, 72), m = l2.g, FT = 54;
  R(m, '#68c844', 0, FT - 4, HW, 4); R(m, '#7edc54', 0, FT - 4, HW, 1);
  for (var y = FT; y < 72; y++) R(m, (((y - FT) >> 1) & 1) ? '#5eb83e' : '#4fa634', 0, y, HW, 1);
  for (x = 0; x < HW; x += 6) R(m, '#74cc4c', x, FT, 1, 72 - FT);
  for (y = FT; y < 72; y++) R(m, (((y - FT) >> 1) & 1) ? '#e8c850' : '#d6b63e', 86, y, 54, 1);
  for (x = 88; x < 140; x += 4) R(m, '#f4dc70', x, FT, 1, 72 - FT);
  var fl = []; for (i = 0; i < 16; i++) fl.push([Math.floor(r() * HW), r() < 0.5 ? '#ff6a6a' : '#ffe86a']);
  fl.forEach(function (f) { R(m, f[1], f[0], FT - 2, 1, 1); });
  // مطحنة
  (function () {
    var cx = 28, top = 22, bot = FT - 1;
    for (var yy = top; yy < bot; yy++) {
      var w = Math.round(8 + (yy - top) * 8 / (bot - top)), x0 = cx - (w >> 1);
      R(m, '#f0e4c8', x0, yy, w >> 1, 1); R(m, '#c8b48c', cx, yy, w - (w >> 1), 1);
      if ((yy - top) % 5 === 0) R(m, '#b09c74', x0, yy, w, 1);
    }
    R(m, '#6a4428', cx - 2, bot - 7, 5, 7); R(m, '#4a6a98', cx - 1, top + 10, 3, 3);
    for (var k = 0; k < 7; k++) { var rw = Math.round(4 + k * 1.3); R(m, '#c4482e', cx - (rw >> 1), top - 7 + k, rw >> 1, 1); R(m, '#8a2c1c', cx, top - 7 + k, rw - (rw >> 1), 1); }
    disc(m, '#5a3a20', cx, top - 3, 2);
  })();
  // سياج
  for (x = 4; x <= 20; x += 4) R(m, '#8a6038', x, FT - 8, 2, 7);
  R(m, '#a87848', 4, FT - 6, 18, 1); R(m, '#a87848', 4, FT - 3, 18, 1);
  // أشجار
  [56, 134].forEach(function (cx) { R(m, '#6a4428', cx - 1, FT - 7, 2, 7); disc(m, '#2e8a3a', cx, FT - 12, 6); disc(m, '#4cac48', cx - 1, FT - 13, 4); R(m, '#78cc5c', cx - 3, FT - 16, 2, 1); });
  // إسطبل
  (function () {
    var cx = 84;
    R(m, '#c4402c', 70, 38, 28, 16); R(m, '#a03020', 91, 38, 7, 16);
    for (var xx = 72; xx < 98; xx += 4) R(m, '#a83624', xx, 39, 1, 15);
    R(m, '#f4ead8', 70, 38, 28, 1);
    for (var i2 = 0; i2 < 10; i2++) { var w = Math.round(8 + i2 * 2.9); R(m, '#7a4630', cx - (w >> 1), 28 + i2, w >> 1, 1); R(m, '#5a2e1e', cx, 28 + i2, w - (w >> 1), 1); }
    R(m, '#f4ead8', cx - 5, 43, 10, 11); R(m, '#b83a28', cx - 4, 44, 8, 10);
    for (var k = 0; k < 8; k++) { R(m, '#f4ead8', cx - 4 + k, 44 + k, 1, 1); R(m, '#f4ead8', cx + 3 - k, 44 + k, 1, 1); }
    R(m, '#f4ead8', cx - 2, 31, 4, 4); R(m, '#3a2a20', cx - 1, 32, 2, 2);
    R(m, '#c8d0d8', 102, 32, 8, 22); R(m, '#a0aab8', 107, 32, 3, 22); R(m, '#8a94a4', 103, 30, 6, 2); R(m, '#8a94a4', 104, 29, 4, 1);
    R(m, '#8a94a4', 102, 38, 8, 1); R(m, '#8a94a4', 102, 45, 8, 1);
  })();
  // كومة قش
  for (i = 0; i < 8; i++) { var hw = Math.round(6 + i * 1.6); R(m, '#e6c458', 122 - hw, 46 + i, hw, 1); R(m, '#c8a440', 122, 46 + i, hw, 1); }
  R(m, '#f4de88', 118, 49, 6, 1); R(m, '#f4de88', 120, 52, 8, 1);

  var gr = mk(HW, 31); g = gr.g;
  R(g, '#dcb878', 0, 3, HW, 28);
  R(g, '#3e8a28', 0, 3, HW, 1);
  for (y = 4; y < 8; y++) for (x = 0; x < HW; x++) R(g, (((x + y) >> 2) & 1) ? '#62c83a' : '#78d84a', x, y, 1, 1);
  R(g, '#3e8a28', 0, 8, HW, 1); R(g, '#b8905a', 0, 9, HW, 2);
  var cols = ['#c8a468', '#ecd096', '#b89058'];
  for (i = 0; i < 46; i++) R(g, cols[i % 3], Math.floor(r() * HW), 11 + Math.floor(r() * 19), 1 + (i & 1), 1);
  for (i = 0; i < 18; i++) { var tx = Math.floor(r() * HW); R(g, '#5cc038', tx, 1, 1, 3); R(g, '#78d84a', tx + 1, 2, 1, 2); }

  var wm = [{ x: 28, y: 19 }];
  return {
    name: 'السهول الخضراء', sub: 'طواحين ومزارع', accent: '#7be04a',
    layers: [{ st: 1, c: sky.c }, { c: l0.c, y: 0, sp: 0.03, drift: 6 }, { c: l1.c, y: (GY - 92) * S, sp: 0.1 }, { c: l2.c, y: (GY - 72) * S, sp: 0.25 }],
    ground: { c: gr.c, y: GROUND_Y - 6, sp: 1 },
    fxBack: function (ctx, a) {
      ctx.globalAlpha = a;
      var base = -(Math.floor(dist * 0.25) % W);
      wm.forEach(function (w) {
        for (var k = 0; k < 2; k++) blades(ctx, base + w.x * S + k * W, (GY - 72 + w.y) * S, time * 1.1);
      });
      ctx.fillStyle = '#3a4a6a';
      birds.forEach(function (b) {
        var px = Math.round(b.x), py = Math.round(b.y);
        if (Math.floor(b.w) % 2) { ctx.fillRect(px, py + 2, 2, 2); ctx.fillRect(px + 2, py, 2, 2); ctx.fillRect(px + 4, py + 2, 2, 2); }
        else { ctx.fillRect(px, py, 2, 2); ctx.fillRect(px + 2, py + 2, 2, 2); ctx.fillRect(px + 4, py, 2, 2); }
      });
      ctx.globalAlpha = 1;
    }
  };
}
function blades(ctx, cx, cy, ang) {
  for (var b = 0; b < 4; b++) {
    var a = ang + b * Math.PI / 2, ca = Math.cos(a), sa = Math.sin(a);
    for (var r = 4; r <= 34; r += 2) {
      var x = Math.round(cx + ca * r), y = Math.round(cy + sa * r);
      ctx.fillStyle = '#7a4a28'; ctx.fillRect(x - 1, y - 1, 2, 2);
      if (r >= 12) {
        ctx.fillStyle = '#f4ecd4';
        ctx.fillRect(Math.round(x - sa * 2) - 1, Math.round(y + ca * 2) - 1, 2, 2);
        ctx.fillStyle = '#d8ccb0';
        ctx.fillRect(Math.round(x - sa * 4) - 1, Math.round(y + ca * 4) - 1, 2, 2);
      }
    }
  }
  ctx.fillStyle = '#5a3a20'; ctx.fillRect(Math.round(cx) - 3, Math.round(cy) - 3, 6, 6);
  ctx.fillStyle = '#a07040'; ctx.fillRect(Math.round(cx) - 1, Math.round(cy) - 1, 2, 2);
}

/* =====================================================================
   العالم 2 : الصحراء  (أهرامات وأبو الهول)
   ===================================================================== */
function buildW2() {
  var r = rng(22), g, i, x, y;
  var sky = mk(HW, HH); g = sky.g;
  bands(g, ['#4ea4dc', '#8ccaec', '#f6e4b0', '#f8c47c'], 0, GY, 4);
  R(g, '#f0c070', 0, GY, HW, HH - GY);
  disc(g, '#ffe58a', 34, 44, 15); disc(g, '#fff4b8', 34, 44, 12); disc(g, '#fffbe0', 34, 44, 9);

  var l0 = mk(HW, 60);
  var st = [[10, 14, 30], [70, 30, 40], [112, 10, 24]];
  wr(function (o) { st.forEach(function (s) { R(l0.g, 'rgba(255,255,255,0.55)', s[0] + o, s[1], s[2], 2); R(l0.g, 'rgba(255,255,255,0.4)', s[0] + 4 + o, s[1] + 2, s[2] - 8, 1); }); });

  var duneA = function (x) { var t = x / HW * Math.PI * 2; return 34 + 8 * Math.sin(2 * t + 0.4) + 5 * Math.sin(3 * t + 1.1); };
  var duneB = function (x) { var t = x / HW * Math.PI * 2; return 20 + 6 * Math.sin(2 * t + 2) + 4 * Math.sin(5 * t + 0.7); };
  var l1 = mk(HW, 96);
  wr(function (o) { pyramid(l1.g, 22 + o, 72, 10, 14, '#ecc884', '#d0a660', '#dcb470', '#c09450'); pyramid(l1.g, 106 + o, 72, 8, 11, '#ecc884', '#d0a660', '#dcb470', '#c09450'); });
  for (x = 0; x < HW; x++) {
    var ta = 96 - Math.round(duneA(x)), tb = 96 - Math.round(duneB(x));
    R(l1.g, '#f3cd82', x, ta, 1, 96 - ta); R(l1.g, '#fbe3a8', x, ta, 1, 1);
    R(l1.g, '#e9bb68', x, tb, 1, 96 - tb); R(l1.g, '#f4d088', x, tb, 1, 1);
  }

  var l2 = mk(HW, 88), m = l2.g, FT = 72;
  R(m, '#f2d080', 0, FT - 3, HW, 3);
  for (y = FT; y < 88; y++) R(m, (((y - FT) >> 1) & 1) ? '#f0cc78' : '#e8c068', 0, y, HW, 1);
  for (i = 0; i < 20; i++) R(m, '#fadf9c', Math.floor(r() * HW), FT + Math.floor(r() * 16), 6, 1);
  pyramid(m, 36, FT, 30, 56, '#f6dc98', '#c99a54', '#dcb470', '#a87c3c');
  pyramid(m, 84, FT, 22, 36, '#f2d48c', '#bf9048', '#d4aa66', '#a07434');
  (function () { // أبو الهول
    var x0 = 98, B = FT;
    R(m, '#c8a050', x0 - 1, B - 1, 38, 2);
    R(m, '#e6b862', x0, B - 9, 24, 9); R(m, '#e6b862', x0, B - 12, 9, 3); R(m, '#c08c40', x0, B - 3, 24, 3); R(m, '#f6d890', x0 + 1, B - 9, 22, 1);
    R(m, '#edc474', x0 + 24, B - 5, 12, 5); R(m, '#b88438', x0 + 24, B - 3, 12, 1); R(m, '#b88438', x0 + 29, B - 5, 1, 5); R(m, '#b88438', x0 + 33, B - 5, 1, 5);
    R(m, '#ecc070', x0 + 20, B - 16, 7, 11);
    R(m, '#ecc070', x0 + 21, B - 25, 6, 9);
    for (var k = 0; k < 6; k++) { R(m, '#2c5aa8', x0 + 19, B - 25 + k * 2, 2, 1); R(m, '#e8c030', x0 + 19, B - 24 + k * 2, 2, 1); R(m, '#2c5aa8', x0 + 27, B - 25 + k * 2, 2, 1); R(m, '#e8c030', x0 + 27, B - 24 + k * 2, 2, 1); }
    R(m, '#e8c030', x0 + 19, B - 27, 10, 2); R(m, '#2c5aa8', x0 + 20, B - 27, 8, 1);
    R(m, '#3a2410', x0 + 25, B - 22, 1, 1); R(m, '#c08c40', x0 + 26, B - 20, 1, 2); R(m, '#a87030', x0 + 24, B - 17, 3, 1); R(m, '#2c5aa8', x0 + 22, B - 16, 4, 3);
  })();
  var palm = function (px, base, h, lean) {
    var i2, top = px + lean;
    for (i2 = 0; i2 <= h; i2++) R(m, i2 % 3 ? '#8a5a30' : '#6a4220', px + Math.round(lean * i2 * i2 / (h * h)), base - i2, 2, 1);
    var fr = [[-1, 0.5], [-1, 0.1], [-1, -0.3], [1, 0.5], [1, 0.1], [1, -0.3], [0, 0.9]];
    fr.forEach(function (f) { for (var t = 0; t < 10; t++) R(m, t % 2 ? '#2f8a3a' : '#4cb048', top + f[0] * t, base - h - f[1] * t + t * t * 0.07, 2, 1); });
    R(m, '#5a3a20', top - 1, base - h + 1, 2, 2); R(m, '#5a3a20', top + 1, base - h + 1, 2, 2);
  };
  wr(function (o) { var mm = m; palm(139 + o, FT, 26, -3); });

  var gr = mk(HW, 31); g = gr.g;
  R(g, '#e8c070', 0, 3, HW, 28);
  R(g, '#a87830', 0, 3, HW, 1); R(g, '#fbe9ae', 0, 4, HW, 1); R(g, '#f6d98c', 0, 5, HW, 3); R(g, '#c89840', 0, 8, HW, 1);
  for (var rowY = 9, row = 0; rowY < 31; rowY += 7, row++) {
    R(g, '#c89840', 0, rowY, HW, 1);
    for (x = (row % 2) * 8; x < HW; x += 16) { R(g, '#c89840', x, rowY, 1, 7); }
    for (x = (row % 2) * 8; x < HW; x += 16) { R(g, '#f2d490', x + 1, rowY + 1, 14, 1); }
  }
  for (i = 0; i < 30; i++) R(g, '#d6a850', Math.floor(r() * HW), 10 + Math.floor(r() * 20), 1, 1);
  for (i = 0; i < 8; i++) { var rx = Math.floor(r() * HW); R(g, '#b89860', rx, 1, 3, 2); R(g, '#d8b878', rx, 1, 2, 1); }

  return {
    name: 'الصحراء', sub: 'الأهرامات وأبو الهول', accent: '#f6c040',
    layers: [{ st: 1, c: sky.c }, { c: l0.c, y: 0, sp: 0.03, drift: 5 }, { c: l1.c, y: (GY - 96) * S, sp: 0.1 }, { c: l2.c, y: (GY - 88) * S, sp: 0.25 }],
    ground: { c: gr.c, y: GROUND_Y - 6, sp: 1 },
    fxFront: function (ctx, a) {
      ctx.fillStyle = 'rgba(255,232,170,' + (0.5 * a).toFixed(2) + ')';
      sand.forEach(function (s) { ctx.fillRect(Math.round(s.x), Math.round(s.y), s.l, 2); });
    }
  };
}

/* =====================================================================
   العالم 3 : الغابة المظلمة  (أشعة الشمس)
   ===================================================================== */

  R(ctx, '#3a2412', px, py, pw, ph); R(ctx, '#f2e4b2', px + 3, py + 3, pw - 6, ph - 6); R(ctx, '#dcc78c', px + 3, py + ph - 12, pw - 6, 9); R(ctx, '#c9aa66', px + 3, py + 3, pw - 6, 2);
  txt('النتيجة', px + pw - 18, py + 22, 15, '#b0602a', null, 'right');
  txt('الأفضل', px + pw - 18, py + 84, 15, '#b0602a', null, 'right');
  var shown = Math.min(score, Math.floor(overT / 0.6 * score + 0.01));
  drawNum(String(shown), px + pw - 62, py + 36, 4, '#ffffff', '#3a2412');
  drawNum(String(best), px + pw - 62, py + 98, 4, '#ffffff', '#3a2412');
  var tier = score >= 40 ? 4 : score >= 30 ? 3 : score >= 20 ? 2 : score >= 10 ? 1 : 0;
  medal(px + 56, py + 78, tier);
  if (newBest) { R(ctx, '#3a2412', px + 88, py + 88, 48, 22); R(ctx, '#e8402c', px + 90, py + 90, 44, 18); txt('جديد!', px + 112, py + 100, 13, '#fff', null); }
  var bw = pw - 60, bx = px + 30, by = py + ph + 18, ready = overT > 0.7;
  ctx.globalAlpha = e * (ready ? 1 : 0.45);
  R(ctx, '#2a4a10', bx - 3, by - 3, bw + 6, 46); R(ctx, '#5cc038', bx, by, bw, 40); R(ctx, '#8ae850', bx, by, bw, 4); R(ctx, '#3e8a28', bx, by + 36, bw, 4);
  txt('العب مرة أخرى', W / 2, by + 21, 19, '#ffffff', '#2a4a10');
  ctx.restore();
}
function render() {
  ctx.save();
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  if (shake > 0) ctx.translate((Math.random() * 2 - 1) * shake * 6, (Math.random() * 2 - 1) * shake * 6);
  if (trans) {
    var e = smooth(trans.t), A = worlds[trans.from], B = worlds[trans.to];
    drawBackdrop(A, 1); drawBackdrop(B, e);
    drawPipes(trans.from, 1); drawPipes(trans.to, e);
    drawGround(A, 1); drawGround(B, e);
    if (A.fxFront) A.fxFront(ctx, 1 - e); if (B.fxFront) B.fxFront(ctx, e);
  } else {
    var w = worlds[curWorld];
    drawBackdrop(w, 1); drawPipes(curWorld, 1); drawGround(w, 1);
    if (w.fxFront) w.fxFront(ctx, 1);
  }
  ctx.globalAlpha = 1;
  drawBird();
  ctx.restore();
  if (flash > 0) { ctx.globalAlpha = Math.min(1, flash); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  if (state === STATE.READY) drawReady();
  if (state === STATE.OVER) drawOver();
  drawHUD();
}

/* =====================================================================
   الإدخال (لمس / ماوس / لوحة المفاتيح)
   ===================================================================== */
function onPress(x, y) {
  if (x !== null && x > W - 46 && y < 46) { Snd.toggle(); return; }
  if (state === STATE.READY) startPlay();
  else if (state === STATE.PLAY) flap();
  else if (state === STATE.OVER && overT > 0.7) resetToReady();
}
window.addEventListener('pointerdown', function (e) {
  e.preventDefault(); Snd.unlock();
  var r = cv.getBoundingClientRect();
  onPress((e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H);
}, { passive: false });
window.addEventListener('keydown', function (e) {
  Snd.unlock();
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Enter') { e.preventDefault(); if (!e.repeat) onPress(null, 0); }
  else if (e.code === 'KeyM') Snd.toggle();
});
['touchend', 'pointerup', 'click'].forEach(function (n) { window.addEventListener(n, Snd.unlock, { passive: true }); });
document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

/* =====================================================================
   الحجم والحلقة الرئيسية (60 إطار/ثانية)
   ===================================================================== */
function resize() {
  var vw = window.innerWidth, vh = window.innerHeight, sc = Math.min(vw / W, vh / H), dpr = window.devicePixelRatio || 1, K = dpr >= 1.75 ? 2 : 1;
  cv.width = W * K; cv.height = H * K;
  cv.style.width = Math.floor(W * sc) + 'px'; cv.style.height = Math.floor(H * sc) + 'px';
  ctx.setTransform(K, 0, 0, K, 0, 0); ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize); window.addEventListener('orientationchange', function () { setTimeout(resize, 100); });
resize();

var last = 0, errShown = false;
function frame(ts) {
  requestAnimationFrame(frame);
  if (!last) { last = ts; return; }
  var dt = (ts - last) / 1000; last = ts;
  if (dt <= 0) return; if (dt > 0.05) dt = 0.05;
  try { update(dt); render(); } catch (err) { if (!errShown) { errShown = true; console.error(err); } }
}
document.addEventListener('visibilitychange', function () { last = 0; });

worlds = [buildW1(), buildW2(), buildW3(), buildW4()];
pipeSpr = pipeDefs().map(makePipe);
birdImg = makeBird();
requestAnimationFrame(frame);
})();
</script>
